<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrientSol 3.0 - Laboratorio Virtual</title>
    <!-- Estilos locales -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Tailwind CSS (Opcional, para diseño responsivo rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Navegación Superior -->
    <nav class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-md">
        <div class="text-2xl font-bold">OrientSol 3.0</div>
        <div>
            <!-- Selector de Idioma -->
            <select id="langSelector" class="bg-blue-800 text-white p-1 rounded">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="flex flex-col md:flex-row p-4 gap-4 h-screen">
        
        <!-- Panel Lateral: Configuración y Datos -->
        <aside class="w-full md:w-1/3 bg-white p-6 rounded-lg shadow-md">

            <h2 class="text-xl font-semibold mb-4" data-i18n="data_input">1. Entrada de Parámetros</h2>

            <!-- Base de Datos Predeterminada -->
            <div class="mb-4 bg-blue-50 p-4 rounded border border-blue-200">
                <label class="block text-sm font-bold mb-1">Base de Datos (Predeterminada)</label>
                <select id="citySelector" class="w-full border p-2 rounded mb-2">
                    <option value="">-- Seleccionar Ciudad --</option>
                    <!-- Las ciudades de datos_mundo.csv aparecerán aquí automáticamente -->
                </select>
            </div>
            
            <!-- 1. Campo independiente para la LATITUD -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1" data-i18n="latitude">Localización (Latitud)</label>
                <input type="number" id="latInput" class="w-full border p-2 rounded" placeholder="Ej: 37.76">
            </div>

            <!-- 2. Campo independiente para la LONGITUD (ESTE ES EL QUE FALTA EN TU IMAGEN) -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1" data-i18n="longitude">Longitud</label>
                <input type="number" id="lonInput" class="w-full border p-2 rounded" placeholder="Ej: -3.78">
            </div>

            <!-- Botón de API -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1" data-i18n="api_connect">Conectar con PVGIS</label>
                <button id="btnFetchAPI" data-i18n="api_connect" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Conectar API</button>
            </div>

            <!-- Carga de archivo CSV -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1" data-i18n="csv_upload">O cargar archivo local (.CSV / Excel)</label>
                <input type="file" id="csvUpload" class="w-full border p-2 rounded text-sm">
            </div>

            <!-- Botón de Simulación -->
            <button id="btnCalculate" class="w-full bg-blue-600 text-white p-2 rounded mt-4 font-bold hover:bg-blue-700" data-i18n="calculate">Ejecutar Simulación Matemática</button>

        </aside>

        <!-- Panel Central: Resultados y Gráficas -->
        <section class="w-full md:w-2/3 bg-white p-6 rounded-lg shadow-md flex flex-col">
            <h2 class="text-xl font-semibold mb-4" data-i18n="results">Resultados</h2>
            
            <!-- Tabla de Resultados -->
            <div class="overflow-x-auto mb-6">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-2 border" data-i18n="month">Mes</th>
                            <th class="p-2 border">Gdm (0º)</th>
                            <th class="p-2 border" data-i18n="opt_annual">Óptima Anual</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <!-- Generado dinámicamente con JS -->
                    </tbody>
                </table>
            </div>

            <!-- Área de Gráficos (Canvas) -->
            <div class="flex-grow bg-gray-50 border rounded flex items-center justify-center">
                <p class="text-gray-400" data-i18n="chart_placeholder">El gráfico aparecerá aquí...</p>
                <!-- <canvas id="chartCanvas"></canvas> -->
            </div>
        </section>

    </main>

    <!-- Script Principal (Módulo ES6) -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
